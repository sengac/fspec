  </g>
  <g id="factory-art"><use href="#blueprint-art" xlink:href="#blueprint-art"/><use href="#solid-art" xlink:href="#solid-art"/></g>
  <g id="wordmark-art" transform="translate(100 578) scale(19.525218680924) translate(-73.799067 -84.325619)">
    <path id="original-wordmark-path" fill="#080C12" d="m 79.391164,84.325619 v 3.825446 h -0.881947 v -2.877354 h -2.516306 v 5.243624 h 1.314653 v 0.948097 h -1.314653 v 5.243624 h 1.314653 v 0.948092 h -3.508497 v -0.948092 h 1.311897 V 84.325619 Z M 89.585923,97.657148 V 100.5345 H 88.703976 V 84.325619 h 4.2802 v 13.331529 z m 2.516306,-0.948092 V 85.273711 h -2.516306 v 11.435345 z m 3.398252,0.948092 V 84.325619 h 4.280202 v 3.825446 h -0.881947 v -2.877354 h -2.516307 v 5.243624 h 1.314652 v 0.948097 h -1.314652 v 5.243624 h 2.516307 v -2.880112 h 0.881947 v 3.828204 z M 86.18767,90.517335 v 7.139813 h -4.2802 v -3.828204 h 0.881947 v 2.880112 h 2.516306 V 91.465432 H 81.90747 v -7.139813 h 4.2802 v 3.825446 h -0.881947 v -2.877354 h -2.516306 v 5.243624 z m 19.50757,6.191721 v -2.880112 h 0.88195 v 3.828204 h -4.2802 V 84.325619 h 4.2802 v 3.825446 h -0.88195 v -2.877354 h -2.5163 v 11.435345 z"/>
  </g>
