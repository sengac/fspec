<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="1040" viewBox="0 0 840 1040" role="img" aria-labelledby="logo-title logo-desc">
<title id="logo-title">fspec — Low Roof Vents / Light README Intro</title>
<desc id="logo-desc">A white-background adaptation of the original fspec factory logo. The original red factory and black cursor are preserved, with an ink-dark blueprint and wordmark, quiet red halos, and slate-gray pixel smoke. Only the smoke and whole cursor animate: the smoke rises in staggered quarter-second steps and the cursor blinks for a four-second introduction, then rests visibly black with smoke hidden. Reduced-motion users receive an immediate still logo. All original vector geometry is preserved.</desc>
<defs>
