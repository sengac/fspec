@keyframes cursor-blink{0%{opacity:1.000000}50%{opacity:0.000000}100%{opacity:1.000000}}
.smoke-v1-p1{animation:smoke-v1-p1 4s step-end;animation-delay:0s;animation-iteration-count:1;animation-fill-mode:both}
@keyframes smoke-v1-p1{0%{transform:translate(0.000000px,0.000000px);opacity:0.000000}6.25%{transform:translate(0.000000px,0.000000px);opacity:0.900000}18.75%{transform:translate(0.000000px,-12.000000px);opacity:0.900000}25%{transform:translate(-12.000000px,-24.000000px);opacity:0.850000}31.25%{transform:translate(-12.000000px,-36.000000px);opacity:0.800000}37.5%{transform:translate(0.000000px,-48.000000px);opacity:0.750000}50%{transform:translate(0.000000px,-60.000000px);opacity:0.700000}56.25%{transform:translate(12.000000px,-72.000000px);opacity:0.650000}62.5%{transform:translate(12.000000px,-84.000000px);opacity:0.550000}75%{transform:translate(0.000000px,-96.000000px);opacity:0.400000}81.25%{transform:translate(0.000000px,-108.000000px);opacity:0.250000}87.5%{transform:translate(-12.000000px,-120.000000px);opacity:0.100000}93.75%{transform:translate(-12.000000px,-120.000000px);opacity:0.000000}100%{transform:translate(0.000000px,0.000000px);opacity:0.000000}}
.smoke-v1-p2{animation:smoke-v1-p2 4s step-end;animation-delay:-2s;animation-iteration-count:1;animation-fill-mode:both}
