[package]
name = "codelet-rpc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "codelet-rpc-server"
path = "src/main.rs"

# MCP-003: a real MCP server for integration tests only; built solely with
# `--features mcp-fixture`, never in production builds.
[[bin]]
name = "fspec-mcp-fixture"
path = "tests/support/mcp_fixture_server.rs"
required-features = ["mcp-fixture"]

[[test]]
name = "mcp003_session_mcp_configuration"
path = "tests/mcp003_session_mcp_configuration.rs"
required-features = ["mcp-fixture"]

[[test]]
name = "mcp004_mcp_http_headers"
path = "tests/mcp004_mcp_http_headers.rs"
required-features = ["mcp-fixture"]

[[test]]
name = "mcp005_stdio_structured_arguments"
path = "tests/mcp005_stdio_structured_arguments.rs"
required-features = ["mcp-fixture"]

[[test]]
name = "mcp006_legacy_sse_transport"
path = "tests/mcp006_legacy_sse_transport.rs"
required-features = ["mcp-fixture"]

[[test]]
name = "mcp008_declarative_session_mcp_set"
path = "tests/mcp008_declarative_session_mcp_set.rs"
required-features = ["mcp-fixture"]

[features]
mcp-fixture = ["dep:serde_json"]

[dependencies]
codelet-rpc = { workspace = true }
codelet-rpc-types = { workspace = true }
# RPC-006: rpc-server main.rs constructs a real WorkUnitsWatcher from a
# `--workspace` arg before passing it into SharedFspecService.
codelet-core = { workspace = true }
tarpc = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
# RPC-456: TLS for non-loopback daemon binds.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# RPC-458: clients trust the public web PKI roots plus a daemon's private CA
# (the same roots tokio-tungstenite's rustls-tls-webpki-roots uses).
webpki-roots = "0.26"
thiserror = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
codelet-common = { workspace = true }
rig-core = { workspace = true }
codelet-sessions = { workspace = true }
serial_test = { workspace = true }
codelet-test-helpers = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
codelet-rpc-embedded = { workspace = true }
codelet-rpc-types = { workspace = true }
codelet-core = { workspace = true }
codelet-providers = { workspace = true, features = ["test-support"] }
futures = { workspace = true }
bincode = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
codelet-tools = { workspace = true }
uuid = { workspace = true }
