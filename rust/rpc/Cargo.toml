[package]
name = "codelet-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# RPC-006: Enable the `test_fixture()` helper from integration tests in
# downstream crates (codelet-rpc-embedded, codelet-rpc-server). Off by
# default — production callers must use a real WorkUnitsWatcher.
test-fixture = []

[lints]
workspace = true

[dependencies]
codelet-rpc-types = { workspace = true }
# RPC-006: SharedFspecService now reads from the lifted WorkUnitsWatcher
# in codelet-core. The dependency arrow rpc → core is permitted; the
# arrow rpc → napi remains forbidden (enforced by the source-shape
# regression test in rust/rpc-embedded/tests/rpc_006_source_shape.rs).
codelet-core = { workspace = true }
# RPC-015: `FspecServiceImpl::checkpoint_counts` delegates to
# `codelet_git::ghost_commit::count_checkpoints(cwd)`. The new
# dependency arrow rpc → git is permitted because both transports
# (embedded + WebSocket) share the SAME `FspecServiceImpl` and we want
# the helper called inside the service body — not duplicated at every
# transport's call site.
codelet-git = { workspace = true }
# PROV-112: disconnect-oauth clears tokens by calling the SAME providers
# primitives the napi *_oauth.rs wrappers use (claude_auth path / codex
# read+write auth / copilot delete_copilot_auth). The arrow rpc → providers
# is permitted (rpc → the napi crate remains forbidden); this keeps the clear
# logic napi-direct in spirit without that forbidden dependency.
codelet-providers = { workspace = true }
tarpc = { workspace = true }
serde = { workspace = true }
# RPC-362: checkpoint timestamp recovery reads the JSON metadata index.
serde_json = { workspace = true }
# RPC-006: Arc<WorkUnitsWatcher>, broadcast::Receiver — tokio sync feature
# is used here, full runtime is unnecessary because this crate hosts no
# server task itself.
tokio = { workspace = true }
# RPC-007: BroadcastLogLayer (tracing::Layer that publishes LogRecord
# values onto SharedFspecService.logs_tx) lives in this crate so both
# rpc-server (binary + tests) and rpc-embedded can use it.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# RPC-011 rule [26]: ArcSwap<WorkUnitsWatcher> inside SharedFspecService
# so the daemon's SIGHUP handler can atomically replace the watcher
# without blocking concurrent readers.
arc-swap = "1.7"
# RPC-025: persistence_add_history parses SessionId values back into
# Uuid form when persisting to the lifted HistoryStore.
uuid = { workspace = true }

[dev-dependencies]
# RPC-362: checkpoint transport integration tests build real temp git repos.
tempfile = { workspace = true }
serde_json = { workspace = true }
