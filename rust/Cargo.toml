[workspace]
members = [
    # RPC-072: NAPI-free home for the FspecAgentHooks impl + the agent
    # loop that drains input_rx, dispatches to the session's LlmProvider,
    # and emits StreamChunk::Text + Done back through
    # BackgroundSession::handle_output. Created here so the `fspec`
    # binary actually drives an LLM (RPC-072 supersedes RPC-030's
    # planning-only scope).
    "agent-loop",
    # RPC-372: axum HTTP attachment viewer server + markdown→HTML renderer.
    # Mirrors the fspec.pro relay-core layout (lib.rs factory + state.rs +
    # handlers/ + config). Started/stopped by the TUI (RPC-373/374 wire keys).
    "attachment-viewer",
    "cli",
    "common",
    "core",
    "fspec",
    # TOOL-019 / RPC-003: pure-Rust home for the future port of the
    # TypeScript fspec CLI commands. Phase 1 ships only command stubs and
    # a synchronous dispatcher entry point so the standalone fspec Rust
    # binary's agent loop no longer hangs on Fspec tool dispatch.
    "fspec-core",
    # RPC-334: vendored+trimmed serde_json error formatter (human-friendly
    # caret diagnostics for corrupted state files). Replaces the V8-emulation
    # parse-error wording with native serde_json diagnostics.
    "fspec-json-error",
    "fspec-tui",
    "git",
    "graph",
    "napi",
    "providers",
    "rpc",
    "rpc-embedded",
    "rpc-server",
    "rpc-types",
    # RPC-038: NAPI-free home for SessionManager + BackgroundSession.
    # Populated by RPC-039/RPC-040.
    "sessions",
    # RPC-067: shared test-only helpers for forbidden-arrow regression
    # tests. Lives outside the napi/sessions arrow graph so any test
    # crate can consume it without pulling forbidden dependencies.
    "test-helpers",
    "tools",
    "tui",
]
resolver = "2"

[workspace.package]
version = "0.10.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/sengac/fspec"

[workspace.dependencies]
# Internal
codelet-cli = { path = "cli" }
# RPC-072: NAPI-free hooks impl + agent_loop. Consumed by codelet-fspec.
codelet-agent-loop = { path = "agent-loop" }
# RPC-372: axum attachment viewer server crate.
codelet-attachment-viewer = { path = "attachment-viewer" }
codelet-common = { path = "common" }
codelet-core = { path = "core" }
# TOOL-019 / RPC-003: pure-Rust home for the future port of the TypeScript
# fspec CLI commands. Phase 1 only ships command stubs + a dispatcher.
codelet-fspec-core = { path = "fspec-core" }
codelet-fspec-json-error = { path = "fspec-json-error" }
codelet-fspec-tui = { path = "fspec-tui" }
codelet-git = { path = "git" }
codelet-graph = { path = "graph" }
codelet-providers = { path = "providers" }
codelet-rpc = { path = "rpc" }
codelet-rpc-embedded = { path = "rpc-embedded" }
codelet-rpc-server = { path = "rpc-server" }
codelet-rpc-types = { path = "rpc-types" }
# RPC-038: NAPI-free session manager crate skeleton. Populated by
# RPC-039/RPC-040; downstream crates (codelet-fspec, codelet-napi) start
# depending on it from Phase 4 onward.
codelet-sessions = { path = "sessions" }
# RPC-067: shared test-only helpers for forbidden-arrow regression
# tests. Consumed under [dev-dependencies] by every workspace crate
# that needs to enforce a no-codelet-napi (or any other forbidden-arrow)
# rule from its tests/*.rs binaries.
codelet-test-helpers = { path = "test-helpers" }
codelet-tools = { path = "tools" }
codelet-tui = { path = "tui" }

# External
# === CLI Framework ===
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"

# === Async Runtime ===
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"

# === LLM Integration ===
rig-core = { version = "0.28.0", default-features = false }

# === HTTP & Networking ===
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }

# === Axum HTTP Server (RPC-372) ===
# Local attachment viewer server. Mirrors the fspec.pro axum architecture:
# build_router(_with_config) factory + Clone-state-newtype-over-Arc + State
# extractor + CorsLayer/TraceLayer. pulldown-cmark renders markdown→HTML
# (GFM); urlencoding percent-decodes the /view/{*path} wildcard.
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
urlencoding = "2"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
schemars = "0.8"

# === Error Handling ===
anyhow = "1"
thiserror = "1"

# === Configuration ===
dotenvy = "0.15.7"
dirs = "6"

# === Terminal & UI ===
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29", features = ["all-widgets"] }
tui-popup = "0.6"
# tui-input — single-line input widget (RPC-009).
# tui-textarea — multi-line input widget (RPC-019).
tui-input = "0.10"
tui-textarea = "0.7"
# unicode-width — display-width wrap geometry (RPC-405); same 0.2 line
# tui-textarea 0.7 / ratatui 0.29 use.
unicode-width = "0.2"

# === Logging ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# === File Operations ===
glob = "0.3"
ignore = "0.4"
globset = "0.4"

# === Gherkin parser (RPC-249) ===
# Pure-Rust port of @cucumber/gherkin used by list-scenario-tags and
# (in future) list-features. Disable default features to keep the
# dep tree small — we only need the `parser` feature.
gherkin = { version = "0.16", default-features = false, features = ["parser"] }

# === Ripgrep Core ===
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"

# === AST-based Code Search ===
ast-grep-core = "0.40"
ast-grep-language = "0.40"

# === Utilities ===
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "2"
regex = "1"
# RPC-321/RPC-236/RPC-233/RPC-312: real, spec-compliant JSON Schema
# validator (the de-facto-standard Rust crate, 4M+ downloads/month — the
# Rust analogue of the TypeScript Ajv used by `src/validators/json-schema.ts`).
# Replaces the previous hand-rolled draft-07 subset validator so foundation
# and tags schema validation share ONE real engine.
jsonschema = { version = "0.46", default-features = false }
ctrlc = "3.4"
once_cell = "1.19"
lazy_static = "1.4"
arc-swap = "1.7"
# RPC-038: codelet-sessions hosts a per-session map keyed by SessionId
# where insertion order matters (the JS SessionManager uses an ordered
# Map). indexmap and parking_lot are pulled to the workspace level so
# every future crate that needs them ("All dependencies are
# workspace-versioned" — RPC-038 attachment) shares the same version.
indexmap = "2"
parking_lot = "0.12"

# === Token Estimation (PROV-002) ===
tiktoken-rs = "0.6"

# === PDF Reading (TOOLS-002) ===
lopdf = "0.36"
# hayro is a pure Rust PDF renderer (MIT/Apache 2.0) - no C dependencies
hayro = "0.5"

# === Codex Provider ===
keyring = "3.3"
sha2 = "0.10"
hex = "0.4"
# UPD-002: in-place self-update engine (codelet-fspec-core::update).
# tar + flate2 extract the unix tar.gz release assets; self-replace handles
# the Windows locked-.exe rename. flate2/hex are already in the lockfile.
tar = "0.4"
flate2 = "1"
self-replace = "1"
# UPD-002: zip extraction for the Windows release assets.
zip = { version = "2", default-features = false, features = ["deflate"] }
# UPD-002: semver comparison for the self-update engine's latest-vs-current
# version check.
semver = "1"

# === Chrome DevTools (WEB-002) ===
# Note: WITHOUT "fetch" feature to avoid auto-downloading Chrome
headless_chrome = "1.0"

# === Browser Launcher (RPC-373) ===
# Opens URLs/files in the user's default browser. Used by codelet-providers
# (OAuth callback flows) and codelet-fspec-tui (board D key → FOUNDATION.md).
open = "5"

# === WebSocket (BRIDGE-001) ===
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"

# === RPC (RPC-005) ===
# tarpc — async RPC framework. We use it both for in-process transport (via
# tarpc::transport::channel) and over WebSocket (via a custom Stream+Sink
# adapter). bincode is the default wire format on the WebSocket transport.
tarpc = { version = "0.34", features = ["full"] }
bincode = "1"

# === File Watching (RPC-006) ===
# notify is the cross-platform fs-watch backbone shared by rust/core
# (the lifted WorkUnitsWatcher) and rust/napi (the legacy ThreadsafeFunction
# bridge wrapping it). notify-debouncer-mini coalesces the storms of events
# notify emits during atomic-write replacements (used by proper-lockfile).
notify = "6"
notify-debouncer-mini = "0.4"

# === PTY (SRV-009) ===
portable-pty = "0.8"
dashmap = "6"

# === MCP Protocol (MCP-001) ===
rmcp = { version = "1.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# === Sampling Profiler (AMGR-017 rewrite) ===
# pprof-rs uses SIGPROF + backtrace-rs to capture per-thread stack samples every
# 1/frequency seconds across ALL threads in the process. This replaces the
# opt-in profile_scope!() macro with a real sampling profiler so the AgentManager
# profile action can see which Rust functions are actually burning CPU —
# not just the ones that were manually tagged.
pprof = { version = "0.14", default-features = false }

# === Testing ===
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3"
proptest = "1"
insta = { version = "1", features = ["yaml"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "warn"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

# Use patched rig-core with cache token support in streaming responses
[patch.crates-io]
rig-core = { path = "patches/rig-core" }

[profile.release]
# AMGR-018: retain line-table DWARF info EMBEDDED inside the .dylib/.node
# so the sampling profiler (pprof-rs + backtrace-rs) can resolve internal
# Rust symbols to file:line, and so `AgentManager.profile` returns
# meaningful attribution instead of phantom `_napi_register_module_v1`
# hot spots.
#
# IMPORTANT: We explicitly set `split-debuginfo = "off"` (instead of the
# macOS default of "packed") because the fspec binary is shipped as a
# Node SEA (Single Executable Application). At launch, the SEA extracts
# the embedded `.node` file to a random temp directory like
# `/var/folders/.../T/fspec-sea-<pid>/codelet-napi.node`. macOS's
# path-convention `.dSYM` lookup then searches for a sibling
# `codelet-napi.node.dSYM` bundle in that temp dir — which never exists
# — so symbol resolution silently fails and every pprof sample resolves
# to a raw address.
#
# Setting `split-debuginfo = "off"` keeps the DWARF section inside the
# Mach-O so the debug info travels with the binary through the SEA
# temp-extract step. Combined with `debug = 1` (line-tables-only), the
# bloat is bounded: only line number mappings are retained, not full
# type info.
#
# `strip = "none"` keeps the symbol table inside the binary so
# backtrace-rs can demangle Rust symbols at sample time.
lto = "fat"
strip = "none"
debug = 1
split-debuginfo = "off"
codegen-units = 1

# Slimmed release profile for distribution of the standalone `fspec` Rust
# ELF/Mach-O binary (rust/fspec). Inherits everything from
# [profile.release] (opt-level) but drops the embedded DWARF + symbol table
# that the macOS-SEA pprof contract requires for the `codelet-napi` `.node`
# artifact.
#
# Rationale: the standalone `fspec` binary is NOT packed into a Node SEA
# and is NOT the pprof sampling target. Keeping `debug = 1` in
# `[profile.release]` for it inflates the Linux/macOS ELF/Mach-O artifact
# from ~150 MB to ~800 MB (81% DWARF) for no operational benefit.
#
# `lto = "thin"` + `codegen-units = 16` override the inherited fat-LTO /
# single-codegen-unit settings. Fat LTO merges the entire dependency graph
# (rig-core, lance, ratatui, axum, ...) into one monolithic LLVM module at
# the final link — that peak memory exceeds the 16 GB ceiling of GitHub's
# standard ARM runners and the OOM killer SIGTERMs the build (exit 143,
# "runner has received a shutdown signal"). Thin LTO keeps cross-crate
# optimization at a small fraction of the memory, and 16 codegen units
# parallelize codegen. The max-opt fat-LTO profile is retained on
# `[profile.release]` where the napi `.node` artifact needs it.
#
# Use this profile when shipping the standalone CLI:
#   cargo build --profile release-slim -p codelet-fspec
# The output lands at:
#   rust/target/release-slim/fspec
#
# Local profiling builds (and any napi build) still use `--release` so the
# pprof + backtrace-rs symbolisation path documented above keeps working.
[profile.release-slim]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"
debug = false
split-debuginfo = "off"

[profile.ci-test]
debug = 1
inherits = "test"
opt-level = 0

# RPC-043: Disk-bloat mitigation.
#
# Background: cargo has no built-in GC for stale build artifacts
# (rust-lang/cargo#10589). The `target/debug/incremental/` directory
# accumulates ~10-20 GB per `cargo test` cycle in this workspace
# because:
#   1. `codelet-napi` has 89 integration test files in tests/*.rs, each
#      becoming its own test binary that statically links the full
#      crate (which transitively pulls in nanograph + arrow +
#      datafusion + lance + tantivy).
#   2. Each test binary keeps its own incremental cache under
#      target/debug/incremental/<crate-hash>/.
#   3. Shape tests (rust/napi/tests/session_bindings_shape.rs) spawn
#      nested `cargo test --no-run -p codelet-napi` from within an
#      already-running test binary, doubling the cache footprint.
#
# Setting `incremental = false` on the test profile kills the largest
# single contributor to disk bloat without affecting the interactive
# dev loop (`cargo build` / `cargo check` still use `[profile.dev]`
# with incremental enabled).
#
# Per the Cargo book: "Incremental compilation is only used for
# workspace members and 'path' dependencies" — i.e. exactly the
# crates whose 89-binary fan-out is hurting us.
#
# ─────────────────────────────────────────────────────────────────────
# INCIDENT 2026-07-10: NEVER run an unscoped `cargo test` or
# `cargo test --workspace` in this workspace.
#
# A plain `cargo test --workspace` compiled all 944 integration-test
# binaries with full DWARF debug info (1.4–2 GB PER BINARY — each one
# statically links the whole crate graph including arrow, datafusion,
# lance and tantivy). target/debug/deps grew to 299 GB (5,185 files,
# 239 binaries over 500 MB) and the machine crashed mid-link.
#
# Safe invocation patterns instead:
#   1. Scope by package + target (preferred):
#        cargo test -p <crate> --test <name>
#   2. Broader runs: list packages explicitly, drop debug info, bound
#      link parallelism:
#        CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
#          cargo test -p <crate-a> -p <crate-b> -j 12 --no-fail-fast
#   3. Or use the dedicated profile below:
#        cargo test --profile ci-test -p <crate>
#
# Parallelism is bounded by default via .cargo/config.toml (build.jobs = 4)
# so every cargo invocation — build, test, check, clippy — caps concurrent
# rustc processes. Override with CARGO_BUILD_JOBS=<n> or -j <n> for faster
# builds on machines with headroom. See that file for the full rationale.
#
# The agent-side guard for this lives in ~/.fspec/blocklist.json
# (rules: cargo-test-workspace-block, cargo-test-unscoped-prompt).
# ─────────────────────────────────────────────────────────────────────
[profile.test]
incremental = false
