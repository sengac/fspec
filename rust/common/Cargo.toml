[package]
name = "codelet-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Common utilities for codelet - logging, context, session management"

[dependencies]
# Async
tokio.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Image dimension extraction (EXT-016)
base64 = "0.22"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true

# Configuration
dirs.workspace = true

# Utilities
chrono.workspace = true
uuid.workspace = true

# BUG-477: cross-process spec write lock (spec_lock.rs)
fs2 = "0.4"
# BUG-597: the locked file is still the file at the lock path (file identity)
same-file = "1"

# Token Estimation (PROV-002)
tiktoken-rs.workspace = true
once_cell.workspace = true

[features]
# BUG-640: the user-directory resolver refuses to fall back to <home>/.fspec
# unless FSPEC_USER_DIR is set. codelet-test-helpers enables it, so every
# test build has it; release builds never do.
test-support = []

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
serial_test.workspace = true

[lints]
workspace = true
