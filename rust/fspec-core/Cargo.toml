[package]
name = "codelet-fspec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust home for the future port of the TypeScript fspec CLI commands (RPC-003 / TOOL-019). Phase 1 ships only command stubs and a dispatcher entry point so the standalone fspec Rust binary's agent loop no longer hangs on Fspec tool dispatch."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
indexmap = { version = "2", features = ["serde"] }
sha2 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
croner = { workspace = true }
jsonschema = { workspace = true }
fs2 = "0.4"
gherkin.workspace = true
regex.workspace = true
# RPC-178/RPC-233/RPC-170: Rust-native Mermaid parser (parity target
# mermaid@11.15.0), parser-only — no render/jsdom. Replaces the Framing-A
# pure-regex pre-check with real syntax validation.
merman-core = "0.8.0-alpha.1"
codelet-git = { path = "../git" }
# RPC-334: shared serde_json parse-error diagnostics (vendored, trimmed
# format_serde_error). Renders a caret-pointed snippet under the offending
# token for corrupted fspec state files.
codelet-fspec-json-error = { workspace = true }
# UPD-002: in-place self-update engine (src/update/). Manual reqwest+sha2
# download-verify-replace path (NOT the self_update crate) so the engine can
# be pointed at a local mock GitHub API via a base_url override. tar +
# flate2 extract the unix tar.gz assets; self-replace handles the Windows
# locked-.exe rename; hex renders SHA-256 digests.
reqwest.workspace = true
tar.workspace = true
flate2.workspace = true
self-replace.workspace = true
hex.workspace = true
semver.workspace = true
zip.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
# UPD-002: tests/upd002_update_engine.rs serves a mock GitHub API on
# 127.0.0.1:0 (axum is a workspace dependency).
axum.workspace = true

[lints]
workspace = true
