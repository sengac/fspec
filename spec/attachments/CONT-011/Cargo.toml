[package]
name = "rig-core"
version = "0.28.0"
edition = "2024"

[lib]
name = "rig"
path = "/Users/rquast/projects/fspec/rust/patches/rig-core/src/lib.rs"
doctest = false

[dependencies]
as-any = "0.3.2"
async-stream = "0.3.6"
base64 = "0.22.1"
bytes = "1.10.1"
codelet-common = { path = "/Users/rquast/projects/fspec/rust/common" }
epub = { version = "2.1.4", optional = true }
futures = "0.3.31"
glob = "0.3.2"
lopdf = { version = "0.36.0", optional = true }
mime_guess = "2.0.5"
ordered-float = "5.0.0"
quick-xml = { version = "0.38.0", optional = true }
rayon = { version = "1.10.0", optional = true }
reqwest = { version = "0.12.20", default-features = false, features = ["json", "stream", "multipart"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tracing = "0.1.41"
url = "2.5"
rmcp = { version = "0.12", optional = true, features = ["client"] }
tokio = { version = "1.45.1", features = ["rt", "sync"] }
http = "1.3.1"
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
serenity = { version = "0.12.4", optional = true }
fastrand = "2.3.0"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
eventsource-stream = "0.2.3"
pin-project-lite = "0.2.16"
futures-timer = "3.0.3"
wasm-bindgen-futures = { version = "0.4.54", optional = true }
mime = "0.3.17"
reqwest-middleware = { version = "0.4.2", optional = true, features = ["json", "multipart", "charset", "http2"] }

[dev-dependencies]
anyhow = "1.0.98"
assert_fs = "1.1.3"
tokio = { version = "1.45.1", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tokio-test = "0.4.4"
serde_path_to_error = "0.1.17"
base64 = "0.22.1"
hyper-util = { version = "0.1.14", features = ["service", "server"] }
rmcp = { version = "0.12", features = ["client", "macros", "reqwest", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server-session", "transport-streamable-http-server", "transport-worker"] }
axum = "0.8.4"
opentelemetry = "0.30.0"
opentelemetry_sdk = { version = "0.30.0", features = ["rt-tokio"] }
opentelemetry-otlp = "0.30.0"
tracing-opentelemetry = "0.31.0"

[features]
default = ["reqwest-tls"]
all = ["derive", "pdf", "rayon"]
audio = []
image = []
derive = []
experimental = []
discord-bot = ["dep:serenity"]
pdf = ["dep:lopdf"]
epub = ["dep:epub", "dep:quick-xml"]
rayon = ["dep:rayon"]
wasm = ["dep:wasm-bindgen-futures", "futures-timer/wasm-bindgen"]
rmcp = ["dep:rmcp"]
socks = ["reqwest/socks"]
reqwest-tls = ["reqwest/default"]
reqwest-rustls = ["reqwest/rustls-tls", "reqwest/charset", "reqwest/http2", "reqwest/macos-system-configuration"]
reqwest-middleware = ["dep:reqwest-middleware"]
reqwest-middleware-rustls = ["reqwest-middleware", "reqwest-middleware/rustls-tls"]

[profile.ci-test]
inherits = "test"
incremental = false

[workspace]
