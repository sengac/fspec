# UPD-001 — cross-platform release pipeline.
#
# Feature: spec/features/cross-platform-release-pipeline-v0-10-0-via-github-actions.feature
#
# Build strategy (native matrix build — the approach that worked in v0.10.0):
#   x86_64-pc-windows-msvc    → ubuntu-24.04      (cargo-xwin)     (zip)
#   aarch64-pc-windows-msvc   → windows-11-arm    (native MSVC)    (zip)
#   x86_64-unknown-linux-gnu  → ubuntu-24.04      (static musl)    (tar.gz)
#   aarch64-unknown-linux-gnu → ubuntu-24.04-arm  (native)         (tar.gz)
#   aarch64-apple-darwin      → macos-latest      (native)         (tar.gz)
#
# x86_64 Linux is built as a fully static musl binary (plain native cargo
# build on the x86_64 host, musl libc, crt-static) so it has NO glibc
# dependency and runs on any x86_64 Linux distro. The asset keeps the name
# fspec-x86_64-unknown-linux-gnu.tar.gz (the UPD-002 self-updater contract
# is the filename, not the build target).
#
# Asset names are a contract with the UPD-002 self-updater:
#   fspec-<target-triple>.zip (Windows) / fspec-<target-triple>.tar.gz (unix)
# containing only the fspec binary. Do not rename these.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write # required to create releases

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # target = asset name; build_target = the cargo target actually
          # built (differs only for the static-musl x86_64 Linux build).
          - target: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            os: ubuntu-24.04
            tool: xwin
            archive: zip
          - target: aarch64-pc-windows-msvc
            build_target: aarch64-pc-windows-msvc
            os: windows-11-arm
            tool: native
            archive: zip
          - target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            tool: musl
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            tool: native
            archive: tar.gz
          - target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            os: macos-latest
            tool: native
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          # cargo-xwin / musl need the TARGET's std library, which rustup
          # does not install by default (E0463: can't find crate for `core`).
          targets: ${{ matrix.build_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # ── Windows x86_64 cross-compile prerequisites (cargo-xwin) ───────────
      - name: Install LLVM + lld (cargo-xwin prerequisites)
        if: matrix.tool == 'xwin'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm lld
          llvm-lib --version
          lld-link --version

      - name: Install cargo-xwin
        if: matrix.tool == 'xwin'
        run: cargo install --locked cargo-xwin

      # ── Static musl prerequisites (x86_64 Linux) ──────────────────────────
      - name: Install musl-tools (static libc)
        if: matrix.tool == 'musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          musl-gcc --version

      # ── protoc (required by lance-encoding build script) ──────────────────
      - name: Install protoc (pinned v34.0)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            if [[ "$RUNNER_ARCH" == "X64" ]]; then
              url="protoc-34.0-linux-x86_64.zip"
            else
              url="protoc-34.0-linux-aarch_64.zip"
            fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            url="protoc-34.0-osx-aarch_64.zip"
          else
            url="protoc-34.0-win64.zip"
          fi
          curl -sSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v34.0/${url}"
          unzip -o protoc.zip -d protoc-bin >/dev/null
          chmod +x protoc-bin/bin/protoc* 2>/dev/null || true
          echo "${GITHUB_WORKSPACE}/protoc-bin/bin" >> "$GITHUB_PATH"
          export PATH="${GITHUB_WORKSPACE}/protoc-bin/bin:$PATH"
          protoc --version

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (release-slim)
        working-directory: rust
        shell: bash
        env:
          # Static musl: link the C runtime statically so the binary has no
          # dynamic libc (glibc) dependency.
          RUSTFLAGS: ${{ matrix.tool == 'musl' && '-C target-feature=+crt-static' || '' }}
        run: |
          if [ "${{ matrix.tool }}" = "xwin" ]; then
            cargo xwin build --profile release-slim --target ${{ matrix.build_target }} -p codelet-fspec
          else
            cargo build --profile release-slim --target ${{ matrix.build_target }} -p codelet-fspec
          fi

      # ── Package ───────────────────────────────────────────────────────────
      # The binary lands under the build_target dir; the asset is named after
      # the (asset) target so the self-updater contract is preserved.
      - name: Package
        working-directory: rust/target/${{ matrix.build_target }}/release-slim
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              powershell.exe -NoProfile -Command "Compress-Archive -Path fspec.exe -DestinationPath fspec-${{ matrix.target }}.zip"
            else
              zip -j fspec-${{ matrix.target }}.zip fspec.exe
            fi
          else
            tar -czf fspec-${{ matrix.target }}.tar.gz fspec
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            unzip -t fspec-${{ matrix.target }}.zip
          else
            tar -tzf fspec-${{ matrix.target }}.tar.gz
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fspec-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.build_target }}/release-slim/fspec-${{ matrix.target }}.zip
            rust/target/${{ matrix.build_target }}/release-slim/fspec-${{ matrix.target }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten into release dir
        run: |
          mkdir -p release
          find dist -name 'fspec-*.zip' -o -name 'fspec-*.tar.gz' | xargs -I{} cp {} release/
          ls -lh release/

      - name: Verify all archives
        run: |
          for f in release/fspec-*; do
            if [[ "$f" == *.zip ]]; then
              unzip -t "$f" > /dev/null
            else
              tar -tzf "$f" > /dev/null
            fi
            echo "✓ $f is valid"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: fspec ${{ github.ref_name }}
          files: release/fspec-*
          generate_release_notes: true
