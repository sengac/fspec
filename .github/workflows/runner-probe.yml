name: Runner Probe

on:
  workflow_dispatch:

jobs:
  probe-windows-x64:
    name: probe windows-2025
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: echo
        shell: bash
        run: |
          echo "windows-2025 x86_64 runner acquired"
          echo "RUNNER_ARCH=$RUNNER_ARCH RUNNER_OS=$RUNNER_OS"
          rustc --version || echo "rust not preinstalled (fine, dtolnay action installs it)"
