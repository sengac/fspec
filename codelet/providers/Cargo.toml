[package]
name = "codelet-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM provider implementations for codelet - Claude, OpenAI, Gemini, Codex"

[dependencies]
codelet-common.workspace = true
codelet-tools.workspace = true

# Async
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio-stream.workspace = true
async-stream.workspace = true

# LLM Integration
rig-core.workspace = true

# HTTP & Networking
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Codex Provider
keyring.workspace = true
sha2.workspace = true
base64 = "0.22"
rand = "0.8"
http = "1"

# Browser OAuth HTTP Server (PROV-013)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
bytes = "1"
open = "5"

# Configuration
dotenvy.workspace = true

# Utilities
regex.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
dirs = "5"
lazy_static = "1.4"

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
codelet-core.workspace = true
serial_test.workspace = true
wiremock = "0.6.5"
base64 = "0.22"

[lints]
workspace = true

[features]
integration-tests = []
