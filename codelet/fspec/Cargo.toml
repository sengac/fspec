[package]
name = "codelet-fspec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# RPC-010: a single binary called `fspec` that is the long-term replacement
# for the TS `fspec` CLI. Three modes via clap subcommands:
#   fspec           - combined (TUI + always-on WS server in one process)
#   fspec daemon    - headless (WS server only, suitable for systemd/launchd)
#   fspec client    - frontend only (WebSocketFspecBackend to a running daemon)
[[bin]]
name = "fspec"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
codelet-rpc.workspace = true
codelet-rpc-types.workspace = true
codelet-rpc-embedded.workspace = true
codelet-rpc-server.workspace = true
codelet-fspec-tui.workspace = true
codelet-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
serde_json.workspace = true
