[package]
name = "codelet-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# RPC-006: Enable the `test_fixture()` helper from integration tests in
# downstream crates (codelet-rpc-embedded, codelet-rpc-server). Off by
# default — production callers must use a real WorkUnitsWatcher.
test-fixture = []

[lints]
workspace = true

[dependencies]
codelet-rpc-types = { workspace = true }
# RPC-006: SharedFspecService now reads from the lifted WorkUnitsWatcher
# in codelet-core. The dependency arrow rpc → core is permitted; the
# arrow rpc → napi remains forbidden (enforced by the source-shape
# regression test in codelet/rpc-embedded/tests/rpc_006_source_shape.rs).
codelet-core = { workspace = true }
tarpc = { workspace = true }
serde = { workspace = true }
# RPC-006: Arc<WorkUnitsWatcher>, broadcast::Receiver — tokio sync feature
# is used here, full runtime is unnecessary because this crate hosts no
# server task itself.
tokio = { workspace = true }
# RPC-007: BroadcastLogLayer (tracing::Layer that publishes LogRecord
# values onto SharedFspecService.logs_tx) lives in this crate so both
# rpc-server (binary + tests) and rpc-embedded can use it.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# RPC-011 rule [26]: ArcSwap<WorkUnitsWatcher> inside SharedFspecService
# so the daemon's SIGHUP handler can atomically replace the watcher
# without blocking concurrent readers.
arc-swap = "1.7"
