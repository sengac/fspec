[package]
name = "codelet-napi"
version = "0.1.0"
edition = "2021"
description = "NAPI-RS bindings for codelet AI agent"
license = "MIT"
publish = false

[lib]
# cdylib for Node.js native module, rlib for Rust tests to import types
crate-type = ["cdylib", "rlib"]

[features]
# Enable noop feature for cargo test - stubs out NAPI symbols so tests can link
noop = ["napi/noop", "napi-derive/noop"]
# Dummy feature that is never enabled — used as a gate on tests that
# depend on modules behind #[cfg(not(feature = "noop"))].
# See the comment above the [[test]] entries that require this feature.
__full_runtime = []

[dependencies]
# NAPI-RS v3 with async support for proper streaming
napi = { version = "3", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "3"

# Codelet crates
codelet-cli = { path = "../cli" }       # RPC-043: agent_loop.rs (run_interactive_session, StreamOutput), persist.rs (codelet_cli::session::Session, system_reminders), bridges.rs (handler closures), session_bindings.rs (session_compact, session_set_model)
codelet-core = { path = "../core" }     # RPC-043: agent_loop.rs (lifecycle_hooks engine fns), persist.rs (AssistantContent persistence)
codelet-git = { path = "../git" }       # RPC-043: agent_loop.rs (worktree helpers), bridges.rs (git bridge wiring), footer_poller.rs (get_current_branch)
codelet-graph = { path = "../graph" }   # RPC-092: KGraph DB + AST pipeline + Learnings extraction — lifted out of codelet/napi/src/graph/ into the NAPI-free codelet-graph crate. codelet/napi/src/graph.rs is now a thin `pub use codelet_graph::*;` shim.
codelet-providers = { path = "../providers" }  # RPC-043: session_bindings.rs (list/show/validate/test/init_provider wrappers), bridges.rs (handler closures capture ProviderManager), agent_loop.rs (provider lookup, CopilotProvider, custom resolver)
codelet-tools = { path = "../tools" }   # RPC-043: agent_loop.rs (McpInjection, tool_pause), session_bindings.rs (PauseState <-> NapiPauseState), bridges.rs (facade, deep_search/agent_manager handlers), footer_poller.rs (footer_cwd), session_hooks.rs (McpInjection signature)
codelet-common = { path = "../common" } # RPC-043: session_bindings.rs (get_data_dir, handle_debug_command_with_dir, SessionMetadata, DebugCommandResult)
# RPC-039: codelet-napi now consumes BackgroundSession + companion types
# from the NAPI-free codelet-sessions crate via `pub use` re-exports in
# codelet/napi/src/session_manager.rs. The agent loop, SessionManager,
# and the `#[napi]` free-function shells stay napi-side for this card;
# RPC-040 moves SessionManager into codelet-sessions and RPC-043 turns
# the entire napi crate into the thin adapter described by the RPC-030
# roadmap.
codelet-sessions = { path = "../sessions" }
# RPC-005: re-export shared serde types from rpc-types with NAPI derives
# applied via the optional `napi` feature gate.
codelet-rpc-types = { path = "../rpc-types", features = ["napi"] }

# AST-grep for NAPI bindings
ast-grep-core.workspace = true
ast-grep-language.workspace = true
ignore.workspace = true

# Rig - LLM framework (workspace version with patch)
rig-core = { version = "0.28.0", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# RPC-058: NapiSchedulerHooks impls codelet_core::scheduler::SchedulerHooks
async-trait = { workspace = true }
futures = "0.3"

# Error handling
anyhow = "1"

# Regex for replace transforms
regex = "1"

# Ripgrep Core — same engine as the Grep tool (AMGR-001 Rule [6])
grep-regex.workspace = true
grep-matcher.workspace = true

# Serialization (for converting types)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# KGRAPH-002: Nanograph embedded graph database
nanograph = "1.0.0"

# KGRAPH-069: Arrow types for graph export (must match nanograph's version)
arrow-array = "57"
arrow-schema = "57"

# KGRAPH-029: Glob matching for AST graph path filters
globset.workspace = true

# KGRAPH-018: TOML parsing for Cargo.toml dependency extraction
toml.workspace = true

# Ordered map for session manager (VIEWNV-001: maintains insertion order)
indexmap = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }

# Environment
dotenvy = "0.15"

# LRU cache for on-demand message loading (BUG-122 Layer 2)
lru = "0.12"

# Persistence module dependencies
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { workspace = true }
croner = { workspace = true }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
lazy_static = "1.4"
once_cell = "1.19"

# Cross-platform file watching
notify = "6"
notify-debouncer-mini = "0.4"

# WebSocket client (BRIDGE-001)
tokio-tungstenite = { workspace = true }
url = { workspace = true }

# KGRAPH-069: ZIP archive for portable graph bundles
zip = { version = "2", default-features = false, features = ["deflate"] }

# Test support (used by integration tests)
tempfile = "3"

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
serial_test = "3"
wiremock = "0.6.5"
reqwest = "0.12"
base64 = "0.22"
# CMPCT-038: twin-parity test — the NAPI twin's apply_pending_dag_and_emit
# must produce the identical CompactionResult to the agent-loop twin.
# Dev-only: production codelet-napi must NOT depend on codelet-agent-loop.
codelet-agent-loop = { path = "../agent-loop" }

[build-dependencies]
napi-build = "2"

# Integration tests that require the noop feature to access testing modules
[[test]]
name = "model_refresh_invalidation_test"
required-features = ["noop"]

[[test]]
name = "model_provider_listing_test"
required-features = ["noop"]

# Tests that depend on modules gated behind #[cfg(not(feature = "noop"))]
# (inject_summary_handler, SessionState, StreamChunk).
# They compile fine in default mode but break under --features noop.
# By declaring a dummy feature that is never enabled, cargo skips these
# tests when building with --features noop.
[[test]]
name = "file_id_propagation_test"
required-features = ["__full_runtime"]

[[test]]
name = "inject_summary_handler_test"
required-features = ["__full_runtime"]

[[test]]
name = "compaction_post_inject_loading_test"
required-features = ["__full_runtime"]

# CMPCT-038: twin-parity measurement-basis tests exercise both the napi and
# agent-loop inject_summary handlers plus real Session construction.
[[test]]
name = "cmpct038_measurement_basis_test"
required-features = ["__full_runtime"]

# CMPCT-039: producer-level growth-case coverage for the NAPI session_compact
# binding — compression_ratio must never ship negative to JavaScript.
[[test]]
name = "cmpct039_ratio_clamp_test"
required-features = ["__full_runtime"]

# RPC-421: compact_session must return an acknowledgement-shaped result
# (no fabricated trough-measured reduction) — both twins + repl_loop shape.
[[test]]
name = "rpc421_honest_ack_test"
required-features = ["__full_runtime"]

[[test]]
name = "session_bindings_smoke"
required-features = ["__full_runtime"]
