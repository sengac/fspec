[package]
name = "codelet-fspec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust home for the future port of the TypeScript fspec CLI commands (RPC-003 / TOOL-019). Phase 1 ships only command stubs and a dispatcher entry point so the standalone fspec Rust binary's agent loop no longer hangs on Fspec tool dispatch."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
indexmap = { version = "2", features = ["serde"] }
fs2 = "0.4"
gherkin.workspace = true
regex.workspace = true
# RPC-178/RPC-233/RPC-170: Rust-native Mermaid parser (parity target
# mermaid@11.15.0), parser-only — no render/jsdom. Replaces the Framing-A
# pure-regex pre-check with real syntax validation.
merman-core = "0.8.0-alpha.1"
codelet-git = { path = "../git" }

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

[lints]
workspace = true
